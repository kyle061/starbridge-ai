name: Starbridge CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: >-
          pnpm exec vitest run
          src/components/account/__tests__/OAuthAuthorizationFlow.openai.spec.ts
          src/components/account/__tests__/OpenAIDeviceAuthorization.spec.ts
          src/components/account/__tests__/OpenAIProviderPresets.spec.ts
          src/components/account/__tests__/CreateAccountModal.spec.ts
          src/components/common/__tests__/Pagination.spec.ts
          src/components/common/__tests__/DataTable.spec.ts
          src/components/layout/__tests__/AppSidebar.spec.ts
          src/components/layout/__tests__/TablePageLayout.spec.ts
          src/components/keys/__tests__/EndpointPopover.spec.ts
          src/components/keys/__tests__/UseKeyModal.spec.ts
          src/utils/__tests__/ccswitchImport.spec.ts
          src/components/modelPlaza/__tests__/PlazaModelPricingTable.spec.ts
          src/components/admin/usage/__tests__/UsageStatsCards.spec.ts
          src/views/user/__tests__/KeysView.spec.ts
          src/views/user/__tests__/PaymentView.spec.ts
          src/views/user/__tests__/RedeemView.spec.ts
          src/components/keys/__tests__/BulkEditKeysModal.spec.ts
          src/components/admin/user/__tests__/ApiKeyLimitsForm.spec.ts
          src/utils/__tests__/oauthCallback.spec.ts
          src/i18n/__tests__/localeKeyCompleteness.spec.ts
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache: true, cache-dependency-path: backend/go.sum }
      - run: go test ./internal/pkg/apicompat ./internal/service -run 'TestOpenAIOAuthService_|TestForwardResponses_ForceChatCompletions|TestResolveOpenAIForwardModel|TestChatCompletionsToResponses'
        working-directory: backend
      - run: go test ./internal/service ./internal/repository ./internal/handler/admin -run TestOpenAIDevice
        working-directory: backend
      - run: >-
          go test ./migrations ./internal/repository ./internal/service ./internal/handler ./internal/handler/dto ./internal/server/routes
          -run 'TestComposite|TestStandardRelay|TestStarbridgeDeepSeek|TestClientRequestedGPT6|TestUsageLogFromService_ShowsGPT6|TestOpenAIAdvancedSchedulerFallsBackAcrossCompositePlatforms'
        working-directory: backend
      - run: >-
          go test -tags unit ./internal/service
          -run 'TestCompositeGPT6|TestAdminService_PreviewCompositeRoute|TestGatewayService_SelectAccountForModelWithExclusions_FallsBackAcrossCompositePlatforms'
        working-directory: backend
      - run: go test ./internal/service -run '^TestOpenAIGatewayServiceRecordUsage_'
        working-directory: backend
      - run: go test -tags unit ./internal/service -run '^TestRetailPricing_'
        working-directory: backend
      - run: go test -tags integration ./internal/repository -run '^TestUsageLogRepoSuite$/^TestGetBatchApiKeyUsageStats' -count=1
        working-directory: backend

      - run: >-
          go test -tags unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/server/middleware ./internal/repository
          -run 'TestPrepaid|TestUserAPIKeyEndpoints|TestAdminUpdateAPIKeyLimits|TestAdminAPIKeyHandler|TestPaymentRechargePreview|TestParsePaymentConfig|TestSettingService_GetPublicSettings_PaymentBalance'
        working-directory: backend

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/starbridge/test_init_env.py
      - run: python3 deploy/starbridge/test_deploy_server.py
      - run: python3 deploy/starbridge/test_restricted_ssh.py
      - run: bash -n deploy/starbridge/deploy-server.sh
      - run: |
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          root = pathlib.Path('deploy/starbridge')
          with tempfile.TemporaryDirectory() as d:
              p = pathlib.Path(d)
              for name in ('.env.example', 'init-env.py'):
                  (p/name).write_bytes((root/name).read_bytes())
              subprocess.run(['python3', str(p/'init-env.py'), '--admin-email', 'ci@example.com'], check=True)
              subprocess.run(['docker', 'compose', '-f', str(root/'compose.yaml'), '--env-file', str(p/'.env'), 'config', '--quiet'], check=True)
          PY
