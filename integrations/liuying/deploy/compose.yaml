services:
  liuying:
    build: ..
    image: liuying-video:1.0.0
    container_name: liuying-video
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PYTHON_BIN: /opt/venv/bin/python
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - ../data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    networks:
      starbridge:
        aliases: [liuying]
networks:
  starbridge:
    external: true
    name: starbridge_default
